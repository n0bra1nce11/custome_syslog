## NXLog Community Edition config: forwards Windows Event Log
## (Application/System/Security) to the central rsyslog collector as
## RFC5424 syslog. Drop-in replacement for the default nxlog.conf.
##
## Setup on the Windows host:
##   1. Install NXLog Community Edition (https://nxlog.co/community).
##      The installer registers AND starts an "nxlog" Windows service
##      automatically - no manual service creation needed (unlike
##      Fluent Bit).
##   2. Replace SYSLOG_SERVER below with the collector's IP/hostname.
##   3. Copy this file to: C:\Program Files\nxlog\conf\nxlog.conf
##   4. Validate the config BEFORE restarting the service - this catches
##      typos/syntax errors up front instead of a silent failed restart.
##      In PowerShell, a quoted path needs the "&" call operator to run
##      it as a command (plain quotes alone are treated as a string):
##        & "C:\Program Files\nxlog\nxlog.exe" -v
##      (In cmd.exe, drop the "&" - quotes alone are enough there.)
##   5. Restart the nxlog service:
##        net stop nxlog
##        net start nxlog
##   6. Allow outbound UDP 514 (or TCP, see below) through the Windows
##      firewall if it's not already open.
##
## If the service won't start or you're not seeing events arrive, run it
## in the foreground to see live errors directly instead of digging
## through service logs:
##   net stop nxlog
##   & "C:\Program Files\nxlog\nxlog.exe" -f
## (Ctrl+C to stop, then "net start nxlog" to go back to running as a
## service.)
##
## Once running, this host will appear in the Grafana dashboard's "host"
## dropdown exactly like a Linux host, using its Windows computer name.

Panic Soft

define ROOT    C:\Program Files\nxlog
define CERTDIR %ROOT%\cert
define CONFDIR %ROOT%\conf
define LOGDIR  %ROOT%\data
define LOGFILE %LOGDIR%\nxlog.log

LogFile %LOGFILE%

# Without this, some NXLog CE Windows builds default to a build-machine
# path (e.g. C:/msys64/configcache.dat) that doesn't exist on a real
# install, logging a (non-fatal but persistent) cache-write error on
# every start/stop.
CacheDir %LOGDIR%

<Extension _syslog>
    Module      xm_syslog
</Extension>

<Input in_eventlog>
    Module      im_msvistalog
    # Add or remove <Select Path="..."> lines to control which event
    # logs are collected.
    <QueryXML>
        <QueryList>
            <Query Id="0">
                <Select Path="Application">*</Select>
                <Select Path="System">*</Select>
                <Select Path="Security">*</Select>
            </Query>
        </QueryList>
    </QueryXML>
</Input>

<Output out_syslog>
    Module      om_udp
    Host        SYSLOG_SERVER
    Port        514
    Exec        to_syslog_ietf();
</Output>

# For guaranteed delivery, swap the Output block above for TCP instead:
# <Output out_syslog>
#     Module      om_tcp
#     Host        SYSLOG_SERVER
#     Port        514
#     Exec        to_syslog_ietf();
# </Output>

<Route eventlog_to_syslog>
    Path        in_eventlog => out_syslog
</Route>
