## Fluent Bit config: reads the Windows Event Log directly and pushes to
## Loki, bypassing rsyslog entirely. Structured fields (Channel, EventID,
## Level, Message, etc.) are preserved as JSON in the log body rather than
## promoted to Loki labels, since their values are high-cardinality and
## exact field names/casing can vary by Fluent Bit version - confirm them
## with a quick look in Grafana Explore after your first events arrive
## (see the note at the bottom of this file).
##
## Setup on the Windows host:
##   1. Download and run the EXE or MSI installer from
##      https://fluentbit.io/download - default install path is
##      C:\Program Files\fluent-bit\, with a default config at
##      C:\Program Files\fluent-bit\conf\fluent-bit.conf
##      NOTE: the installer does NOT register a Windows service by
##      itself - that's a separate manual step (see step 4 below).
##   2. Replace SYSLOG_SERVER below with the collector's IP/hostname.
##   3. Copy this file over that default config path.
##   4. Register it as a service (run once, in an Administrator
##      PowerShell prompt):
##        New-Service fluent-bit -BinaryPathName '"C:\Program Files\fluent-bit\bin\fluent-bit.exe" -c "C:\Program Files\fluent-bit\conf\fluent-bit.conf"' -StartupType Automatic
##        Start-Service fluent-bit
##      To apply config changes later: Restart-Service fluent-bit
##   5. Allow outbound TCP 3100 through the Windows firewall if it's not
##      already open.
##
## This host will appear under a "windows_events" job in Loki - it does
## NOT show up in the existing "Syslog Overview" dashboard (that one only
## shows job="syslog"). Use the separate "Windows Event Log" dashboard
## instead (grafana/dashboards/windows-events.json), provisioned
## automatically alongside it.

[SERVICE]
    Flush        5
    Log_Level    info
    Daemon       off

[INPUT]
    Name         winlog
    Channels     Application,System,Security
    Interval_Sec 1
    Tag          winlog

[OUTPUT]
    Name         loki
    Match        winlog
    Host         SYSLOG_SERVER
    Port         3100
    Labels       job=windows_events, host=${COMPUTERNAME}
    Line_Format  json

## First-run tip: exact field names emitted by the winlog plugin (e.g.
## "Channel", "EventID", "Level", "Message") can vary slightly by
## version. After you see events arriving, open Grafana -> Explore ->
## Loki -> run `{job="windows_events"}` and expand one line to confirm
## the real field names, then adjust the "Events by Channel" panel query
## in the Windows Event Log dashboard if needed (it currently assumes a
## field called "Channel").
