# Drop this file at /etc/rsyslog.d/60-forward.conf on any Linux host you
# want to send logs to the central collector, then restart rsyslog:
#   sudo systemctl restart rsyslog
#
# Replace SYSLOG_SERVER with the collector's IP/hostname.

*.* action(type="omfwd" target="SYSLOG_SERVER" port="514" protocol="udp")

# For guaranteed delivery over TCP instead of UDP, use this instead:
# *.* action(type="omfwd" target="SYSLOG_SERVER" port="514" protocol="tcp")

# For reliable delivery over RELP (recommended for WAN links / unreliable
# networks), install rsyslog-relp and use:
# module(load="omrelp")
# *.* action(type="omrelp" target="SYSLOG_SERVER" port="20514")
