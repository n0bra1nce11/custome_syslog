#############################################################
# rsyslog.conf - syslog collector for rsyslog+Loki+Grafana stack
#############################################################

global(workDirectory="/var/lib/rsyslog")

# --- Local input modules (lets `logger` inside this container work too) ---
module(load="imuxsock")
module(load="imklog")

# --- Network input modules: accept logs from remote hosts/devices ---
module(load="imudp")
module(load="imtcp")
module(load="imrelp")

input(type="imudp" port="514")
input(type="imtcp" port="514")
input(type="imrelp" port="20514")

# --- Tuning: queue settings so a burst of remote logs isn't dropped ---
main_queue(
  queue.type="LinkedList"
  queue.size="100000"
  queue.workerThreads="4"
  queue.dequeueBatchSize="1000"
)

# --- JSON template consumed by Promtail ---
# One JSON object per line: timestamp, source host, severity, facility,
# app name, pid and message. This makes Loki label extraction trivial
# and keeps the message field safely escaped.
template(name="jsonlog" type="list") {
  constant(value="{")
  constant(value="\"timestamp\":\"")   property(name="timereported" dateFormat="rfc3339")
  constant(value="\",\"host\":\"")     property(name="hostname")
  constant(value="\",\"severity\":\"") property(name="syslogseverity-text")
  constant(value="\",\"facility\":\"") property(name="syslogfacility-text")
  constant(value="\",\"app\":\"")      property(name="programname" format="json")
  constant(value="\",\"pid\":\"")      property(name="procid")
  constant(value="\",\"message\":\"")  property(name="msg" format="json")
  constant(value="\"}\n")
}

# One file per source host, so retention/rotation and Promtail globbing
# are simple: /var/log/rsyslog/hosts/<hostname>/syslog.json
template(name="DynFile" type="string" string="/var/log/rsyslog/hosts/%hostname%/syslog.json")

action(
  type="omfile"
  dynaFile="DynFile"
  dynaFileCacheSize="200"
  template="jsonlog"
  dirCreateMode="0755"
  fileCreateMode="0644"
  flushOnTXEnd="on"
  ioBufferSize="16k"
)
